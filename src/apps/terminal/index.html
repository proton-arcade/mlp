<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<style>
    html, body { height: 100%; margin: 0; }
    body { background: #14171a; color: #d8e2d0; font: 14px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; display: flex; flex-direction: column; }
    #out { flex: 1; overflow-y: auto; padding: 12px 14px 0; white-space: pre-wrap; word-break: break-word; }
    .line { min-height: 1.45em; }
    .prompt { color: #9ede6a; }
    .err { color: #ff8a80; }
    .muted { color: #7d8b78; }
    #bar { display: flex; align-items: center; padding: 6px 14px 12px; gap: 8px; }
    #in { flex: 1; background: transparent; border: 0; outline: 0; color: inherit; font: inherit; caret-color: #9ede6a; }
</style>
</head>
<body>
<div id="out" aria-live="polite"></div>
<form id="bar" autocomplete="off">
    <span class="prompt" id="ps1">mixt@desk:~$</span>
    <input id="in" type="text" spellcheck="false" autocapitalize="off" aria-label="Command" autofocus>
</form>
<script src="app.js"></script>
</body>
</html>
