<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music</title>
<link rel="stylesheet" href="/builtin/shared/apps.css">
<style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .library-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #e3e3e1; background: #fff; }
    .library-head h2 { font-size: 16px; margin: 0; flex: 1; }
    .library-head input[type=search] { width: 220px; max-width: 40%; padding: 6px 8px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
    .drop { flex: 1; overflow-y: auto; min-height: 0; background: #fbfbfa; position: relative; }
    .drop.over { outline: 2px dashed #3a7d44; outline-offset: -8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #efefed; white-space: nowrap; }
    th { font-size: 12px; color: #6b7174; font-weight: 600; position: sticky; top: 0; background: #fbfbfa; }
    td.n { width: 42px; color: #6b7174; }
    td.t { max-width: 1px; width: 100%; overflow: hidden; text-overflow: ellipsis; }
    td.d, th.d { width: 80px; text-align: right; color: #6b7174; font-variant-numeric: tabular-nums; }
    td.x, th.x { width: 40px; text-align: center; }
    tr.row { cursor: pointer; }
    tr.row:hover { background: #f4f4f2; }
    tr.row.selected { background: #e6f1d9; }
    tr.row.playing td.t { color: #3a7d44; font-weight: 600; }
    .remove { border: 0; background: transparent; color: #8a8f8c; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .remove:hover { background: #e7d6d6; color: #8a1f1f; }
    .empty { color: #888a85; text-align: center; padding: 48px 24px; line-height: 1.6; }
    .empty strong { display: block; font-size: 16px; color: inherit; margin-bottom: 6px; }
    .player { border-top: 1px solid #d6d6d4; background: #fff; padding: 10px 16px; display: grid; grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr); gap: 16px; align-items: center; }
    .now { min-width: 0; }
    .now .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now .s { font-size: 12px; color: #6b7174; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .buttons { display: flex; align-items: center; gap: 10px; }
    .buttons button { border: 1px solid #bbb; background: #fff; border-radius: 16px; min-width: 34px; height: 30px; padding: 0 8px; font: inherit; cursor: pointer; color: inherit; }
    .buttons button:hover:not(:disabled) { background: #f0f0ef; }
    .buttons button:disabled { opacity: .4; cursor: default; }
    .buttons button.on { border-color: #3a7d44; color: #3a7d44; }
    .buttons #play { background: #3a7d44; border-color: #3a7d44; color: #fff; min-width: 44px; height: 36px; border-radius: 18px; font-size: 16px; }
    .buttons #play:hover:not(:disabled) { background: #2f6837; }
    .seek { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 520px; font-size: 12px; color: #6b7174; font-variant-numeric: tabular-nums; }
    .seek input { flex: 1; }
    .volume { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 12px; color: #6b7174; }
    .volume input { width: 120px; }
    .hidden { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 680px) {
        .player { grid-template-columns: 1fr; }
        .volume { justify-content: center; }
        .library-head input[type=search] { max-width: 45%; }
        th.d, td.d { display: none; }
    }
    @media (prefers-color-scheme: dark) {
        .library-head, .player { background: #2d2f31; border-color: #111; }
        .library-head input[type=search], .buttons button { background: #232527; border-color: #555; color: #eeeeec; }
        .drop { background: #232527; }
        th { background: #232527; }
        th, td, .library-head, .player { border-color: #3a3d40; }
        tr.row:hover { background: #36393c; }
        tr.row.selected { background: #2f4a25; }
        tr.row.playing td.t { color: #9fd58a; }
        .now .s, td.n, td.d, th.d, .seek, .volume, .empty, th { color: #aaa; }
    }
</style>
</head>
<body>
<header class="toolbar">
    <h1>Music</h1>
    <button id="add" class="btn primary" type="button">Add songs</button>
    <button id="remove" class="btn" type="button" disabled>Remove</button>
    <input id="file" type="file" accept=".mp3,audio/mpeg" multiple class="hidden">
</header>
<section class="main">
    <div class="library-head">
        <h2 id="count">Music folder</h2>
        <input id="search" type="search" placeholder="Find in library" aria-label="Find in library">
    </div>
    <div id="drop" class="drop" tabindex="0" aria-label="Music folder. Drop audio files here to add them.">
        <table class="hidden" id="table">
            <thead><tr><th class="n">#</th><th>Title</th><th class="d">Length</th><th class="x"><span class="sr">Remove</span></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty">
            <strong>The Music folder is empty</strong>
            Click <em>Add songs</em> or drop audio files here. Songs are kept in your Music folder (~/Music) and streamed from the server.
        </div>
    </div>
    <footer class="player">
        <div class="now">
            <div id="nowTitle" class="t">Nothing playing</div>
            <div id="nowSub" class="s">Add a song to start</div>
        </div>
        <div class="controls">
            <div class="buttons">
                <button id="shuffle" type="button" title="Shuffle" aria-pressed="false">Shuffle</button>
                <button id="prev" type="button" title="Previous" aria-label="Previous">&#9198;</button>
                <button id="play" type="button" title="Play" aria-label="Play" disabled>&#9654;</button>
                <button id="next" type="button" title="Next" aria-label="Next">&#9197;</button>
                <button id="repeat" type="button" title="Repeat: off" aria-label="Repeat off">Repeat</button>
            </div>
            <div class="seek">
                <span id="cur">0:00</span>
                <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek" disabled>
                <span id="dur">0:00</span>
            </div>
        </div>
        <div class="volume">
            <span>Volume</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
        </div>
    </footer>
</section>
<audio id="audio" preload="metadata"></audio>
<script src="/sdk/mixt.js"></script>
<script src="app.js"></script>
</body>
</html>
