<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-Talk</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #202124; background: #fff; display: flex; flex-direction: column; }
    button, input { font: inherit; }
    button { padding: 6px 12px; border: 1px solid #dadce0; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; }
    button:hover { background: #1765cc; }
    button:disabled { opacity: .5; cursor: default; }
    input { padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; min-width: 0; }
    input:focus { outline: 2px solid #1a73e8; outline-offset: -1px; }

    header { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
    header strong { font-size: 16px; color: #1a73e8; }
    .status { color: #5f6368; font-size: 12px; }

    .wrap { flex: 1; display: flex; min-height: 0; }
    aside { width: 220px; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; min-height: 0; flex: none; }
    aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #5f6368; margin: 12px 12px 6px; }
    #contacts { list-style: none; margin: 0; padding: 0 6px; overflow: auto; flex: 1; }
    #contacts li button { width: 100%; text-align: left; border: 0; background: transparent; color: #202124; padding: 8px; border-radius: 6px; }
    #contacts li button:hover { background: #f1f3f4; }
    #contacts li button.active { background: #e8f0fe; color: #174ea6; font-weight: 600; }
    .addc { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #e0e0e0; }
    .addc input { flex: 1; width: 100%; }

    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .peer { height: 44px; padding: 0 16px; display: flex; align-items: center; border-bottom: 1px solid #e0e0e0; font-weight: 600; }
    #log { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 14px; background: #f1f3f4; align-self: flex-start; white-space: pre-wrap; word-wrap: break-word; }
    .msg.mine { background: #1a73e8; color: #fff; align-self: flex-end; }
    .msg .who { display: block; font-size: 11px; color: #5f6368; margin-bottom: 2px; }
    .msg.mine .who { color: #d2e3fc; }
    .empty { color: #5f6368; margin: auto; text-align: center; }
    .err { color: #d93025; min-height: 18px; padding: 0 16px; font-size: 13px; }

    form.send { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid #e0e0e0; }
    form.send input { flex: 1; }
</style>
</head>
<body>
<header>
    <strong>G-Talk</strong>
    <span class="status" id="status">Connecting…</span>
</header>
<div class="wrap">
    <aside>
        <h3>People</h3>
        <ul id="contacts"></ul>
        <form class="addc" id="addForm">
            <input id="newContact" placeholder="Add a username" maxlength="64" autocomplete="off">
            <button type="submit">Add</button>
        </form>
    </aside>
    <main>
        <div class="peer" id="peer">Choose someone to talk to</div>
        <div id="log"><p class="empty">Add a username on the left to start a chat. Each chat is one-to-one.</p></div>
        <div class="err" id="err"></div>
        <form class="send" id="sendForm">
            <input id="text" placeholder="Type a message" maxlength="2000" autocomplete="off" disabled>
            <button type="submit" id="send" disabled>Send</button>
        </form>
    </main>
</div>
<script src="vendor/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
