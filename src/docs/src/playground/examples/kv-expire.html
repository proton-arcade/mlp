<html>
<body>
    <script src="/mixt.js/v2"></script>
    <script>
        (async () => {
            // (1) Create a new key-value pair
            await mixt.kv.set('name', 'Mixt OS Smith');
            mixt.print("Key-value pair 'name' created/updated<br>");

            // (2) Set key to expire in 1 second
            await mixt.kv.expire('name', 1);
            
            // (3) Wait 2 seconds and get the value
            setTimeout(async () => {
                const name = await mixt.kv.get('name');
                mixt.print("Value :", name);
            }, 2000);
        })();
    </script>
</body>
</html>
