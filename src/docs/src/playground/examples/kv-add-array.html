<html>
<body>
    <script src="/mixt.js/v2"></script>
    <script>
        (async () => {
            await mixt.kv.set('scores', [1, 2, 3, 4]);

            // Each element of the array you pass is appended
            const updated = await mixt.kv.add('scores', [5]);
            mixt.print(`Updated scores: ${JSON.stringify(updated)}<br>`);

            // Passing several values appends all of them
            const extended = await mixt.kv.add('scores', [6, 7]);
            mixt.print(`Extended scores: ${JSON.stringify(extended)}`);
        })();
    </script>
</body>
</html>
