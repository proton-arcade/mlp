<html>
<body>
    <script src="/mixt.js/v2"></script>
    <script>
        (async () => {
            // (1) Create a random file
            let filename = mixt.randName();
            await mixt.fs.write(filename, 'Hello, world!');
            document.write('File created successfully<br>');

            // (2) Delete the file
            await mixt.fs.delete(filename);
            document.write('File deleted successfully');
        })();
    </script>
</body>
</html>
