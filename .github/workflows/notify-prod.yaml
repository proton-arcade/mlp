name: Notify proton-arcade

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mixt build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.MIXT_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/proton-arcade/mixt/dispatches \
            -d '{"event_type":"mixt-main-updated","client_payload":{"mixt_ref":"main"}}'